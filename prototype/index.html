<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حارس القافلة — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0b09;color:#f8efe0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
#game{width:min(100vw,430px);height:min(100vh,820px);position:relative;overflow:hidden;background:#15110d}
.screen{position:absolute;inset:0;padding:18px;display:none}.screen.active{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:950;font-size:22px;letter-spacing:-.5px}.coin{background:#2a2117;border:1px solid #5e492e;border-radius:999px;padding:8px 12px;font-weight:800}
.subtitle{color:#b9aa93;font-size:13px;margin-top:3px}.card{background:#1b1712;border:1px solid #3d3122;border-radius:18px;padding:14px;margin-top:14px}
.scene{height:245px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#253c49 0 42%,#c8914d 43% 72%,#a96f39 73%);border:1px solid #5d452a}
.sun{position:absolute;width:48px;height:48px;border-radius:50%;background:#f5d98b;left:28px;top:25px;box-shadow:0 0 45px #f5d98b66}
.star{position:absolute;color:#f3dfaa;font-size:12px}.s1{right:32px;top:30px}.s2{right:88px;top:60px}.s3{right:145px;top:22px}
.dune{position:absolute;left:-10%;right:-10%;height:85px;border-radius:50% 50% 0 0/60% 60% 0 0;background:#b77b40;bottom:20px}
.dune2{bottom:-25px;background:#8f5d35}
.fort{position:absolute;right:23px;bottom:63px;font-size:68px;filter:drop-shadow(0 7px 3px #0004)}
.camel{position:absolute;left:28px;bottom:53px;font-size:57px;filter:drop-shadow(0 7px 3px #0004)}
.scenetxt{position:absolute;inset:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:950;font-size:20px;text-shadow:0 2px 8px #0008;z-index:4}
.scenetxt span{font-size:12px;color:#f4dfba;margin-top:4px}
.capacity{display:flex;justify-content:space-between;font-size:12px;color:#b9aa93;margin-bottom:7px}.bar{height:8px;background:#0e0d0b;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#d5a75c;transition:.25s}
.geargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.gear{min-height:82px;border:1px solid #443724;border-radius:14px;background:#242018;color:#f7ecd8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:27px;cursor:pointer}.gear small{font-size:10px;color:#bcae98}.gear.sel{border-color:#d5a75c;background:#3a2c1b;transform:translateY(-2px)}
.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:0;border-radius:13px;padding:13px 12px;font-weight:950;font-size:15px;cursor:pointer}.primary{background:#d5a75c;color:#21170d}.secondary{background:#29231b;color:#eee0ca;border:1px solid #4b3c28}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c9b99f}.hearts{letter-spacing:2px}
#defenseScene{height:445px;position:relative}.enemy{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#251915;border:2px solid #b86b42;box-shadow:0 6px 20px #0006;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .08s}
.enemy.hit{transform:scale(.75);opacity:.2}.aim{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;border:2px solid #d5a75c88;display:grid;place-items:center;font-size:42px;background:#17130fbb;box-shadow:0 0 0 8px #d5a75c12}
.wave{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5}.pill{background:#17130fcc;border:1px solid #5a452c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.result{text-align:center;padding-top:100px}.result .big{font-size:62px}.result h2{font-size:28px;margin:10px 0 4px}.result p{color:#b9aa93;margin:0}
@media(max-height:680px){#game{height:100vh}.scene{height:205px}.gear{min-height:70px}#defenseScene{height:390px}}
</style>
</head>
<body>
<div id="game">
<section id="prep" class="screen active">
 <div class="top"><div><div class="brand">🏜️ حارس القافلة</div><div class="subtitle">جهّز الحمولة. ثم اثبت في وجه الغزاة.</div></div><div class="coin">🪙 <b id="coins">120</b></div></div>
 <div class="card">
  <div class="scene"><div class="sun"></div><i class="star s1">✦</i><i class="star s2">✦</i><i class="star s3">✦</i><div class="dune"></div><div class="dune dune2"></div><div class="fort">🏰</div><div class="camel">🐪</div><div class="scenetxt">قافلة نجد<span>المرحلة 1 · قبل الغروب</span></div></div>
 </div>
 <div class="card">
  <div class="capacity"><span>سعة العربة</span><b><span id="used">0</span> / 10</b></div><div class="bar"><div id="fill" class="fill"></div></div>
  <div class="geargrid" id="geargrid"></div>
  <div class="actions"><button class="btn secondary" id="clear">تفريغ</button><button class="btn primary" id="start">ابدأ الدفاع ⚔️</button></div>
 </div>
</section>

<section id="defend" class="screen">
 <div class="top"><div><div class="brand">⚔️ الدفاع عن القافلة</div><div class="subtitle">لا تدع الغزاة يصلون إلى البضاعة.</div></div><div class="coin">🪙 <b id="dcoins">120</b></div></div>
 <div class="card"><div class="status"><span>القافلة</span><span class="hearts" id="hearts">❤️❤️❤️</span></div><div class="bar"><div id="danger" class="fill" style="width:0%"></div></div></div>
 <div class="card" style="padding:8px"><div id="defenseScene" class="scene"><div class="sun"></div><i class="star s1">✦</i><i class="star s2">✦</i><div class="dune"></div><div class="dune dune2"></div><div class="fort">🏰</div><div class="camel">🐪</div><div class="wave"><span class="pill">موجة <b id="wave">1</b>/3</span><span class="pill">🎯 <b id="kills">0</b></span></div><div class="aim">🏹</div></div></div>
</section>

<section id="result" class="screen"><div class="result"><div class="big" id="resultIcon">🏆</div><h2 id="resultTitle">نجوت!</h2><p id="resultText"></p><div class="actions" style="margin-top:24px"><button class="btn primary" id="again">جولة جديدة</button></div></div></section>
</div>
<script>
(()=>{const $=id=>document.getElementById(id), prep=$('prep'),defend=$('defend'),result=$('result');
const gear=[['🏹','قوس','2'],['🛡️','درع','3'],['🔥','مشعل','2'],['🪓','فأس','3'],['💧','ماء','1'],['🧭','بوصلة','1'],['🗡️','سيف','2'],['🪙','ذهب','2']];
let selected=[],used=0,coins=120,wave=1,kills=0,damage=0,spawnTimer=null;
function renderGear(){const g=$('geargrid');g.innerHTML='';gear.forEach((x,i)=>{const b=document.createElement('button');b.className='gear'+(selected.includes(i)?' sel':'');b.innerHTML=x[0]+'<small>'+x[1]+' · '+x[2]+'</small>';b.onclick=()=>{if(selected.includes(i)){selected=selected.filter(v=>v!==i);used-=+x[2]}else if(used+ +x[2]<=10){selected.push(i);used+=+x[2]}renderGear();updateCap()};g.appendChild(b)})}
function updateCap(){$('used').textContent=used;$('fill').style.width=(used*10)+'%'}
function reset(){selected=[];used=0;wave=1;kills=0;damage=0;coins=120;clearTimeout(spawnTimer);prep.classList.add('active');defend.classList.remove('active');result.classList.remove('active');$('coins').textContent=coins;renderGear();updateCap()}
function start(){if(used<6){$('start').textContent='اختر حمولة أكبر';setTimeout(()=>$('start').textContent='ابدأ الدفاع ⚔️',900);return}prep.classList.remove('active');defend.classList.add('active');$('dcoins').textContent=coins;$('wave').textContent=wave;$('kills').textContent=kills;spawnWave()}
function spawnWave(){const arena=$('defenseScene');arena.querySelectorAll('.enemy').forEach(e=>e.remove());let count=3+wave;let left=count;
for(let i=0;i<count;i++){setTimeout(()=>{const e=document.createElement('div');e.className='enemy';e.textContent=i%2?'🦂':'🗡️';e.style.right=(8+Math.random()*78)+'%';e.style.top=(70+Math.random()*210)+'px';e.onclick=()=>{if(e.classList.contains('hit'))return;e.classList.add('hit');kills++;coins+=5;$('kills').textContent=kills;left--;if(left===0){if(wave<3){wave++;$('wave').textContent=wave;setTimeout(spawnWave,500)}else win()}};arena.appendChild(e)},i*350)}}
function win(){$('resultIcon').textContent='🏆';$('resultTitle').textContent='القافلة وصلت';$('resultText').textContent='مكافأة الجولة: '+(30+kills*5)+' 🪙';defend.classList.remove('active');result.classList.add('active')}
$('start').onclick=start;$('clear').onclick=()=>{selected=[];used=0;renderGear();updateCap()};$('again').onclick=reset;renderGear();updateCap();
})();
</script>
</body>
</html>
