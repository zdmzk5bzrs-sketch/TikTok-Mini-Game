<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حارس القافلة</title>
<style>body{margin:0;background:#17110c;color:#fff;font-family:Arial,sans-serif;text-align:center}main{max-width:480px;margin:auto;padding:20px}button{display:block;width:100%;margin:10px 0;padding:18px;border:0;border-radius:12px;background:#392619;color:#fff;font-size:20px}#scene{height:330px;border-radius:18px;background:linear-gradient(#171b2b,#8d5b31);position:relative;margin:20px 0;overflow:hidden}#camel{position:absolute;bottom:55px;left:30px;font-size:60px}.enemy{position:absolute;bottom:70px;font-size:48px;cursor:pointer;transition:.15s}.enemy:hover{transform:scale(1.15)}.hide{display:none}.stat{font-size:20px;margin:12px}</style></head>
<body><main><h1>🏜️ حارس القافلة</h1><div id="stats" class="stat"></div><div id="scene"><div id="camel">🐪</div></div><div id="msg">اضغط الغزاة قبل أن يصلوا للقافلة!</div><button id="start">ابدأ الدفاع ⚔️</button><button id="reset" class="hide">إعادة المحاولة ↻</button></main>
<script>
let hp=3,wave=1,left=3,coins=120,active=false,timer;
const scene=document.querySelector('#scene'),stats=document.querySelector('#stats'),msg=document.querySelector('#msg'),start=document.querySelector('#start'),reset=document.querySelector('#reset');
function update(){stats.textContent='❤️ '+hp+'   |   الموجة '+wave+'/3   |   الأعداء '+left+'   |   🪙 '+coins}
function spawn(){for(let i=0;i<3;i++){let e=document.createElement('button');e.className='enemy';e.textContent=i===1?'🦂':'⚔️';e.style.left=(210+i*75)+'px';e.style.bottom=(65+i%2*55)+'px';e.onclick=()=>{if(!active)return;e.remove();left--;coins+=10;update();if(left===0){if(wave<3){wave++;left=3;msg.textContent='موجة جديدة!';spawn()}else win()}};scene.appendChild(e)}}
function startGame(){hp=3;wave=1;left=3;active=true;start.classList.add('hide');reset.classList.add('hide');msg.textContent='دافع عن القافلة!';document.querySelectorAll('.enemy').forEach(e=>e.remove());update();spawn();clearInterval(timer);timer=setInterval(()=>{if(!active)return;hp--;update();if(hp<=0)lose()},3500)}
function win(){active=false;clearInterval(timer);coins+=50+9*10;msg.textContent='🏆 وصلت القافلة! المكافأة +140 🪙';reset.classList.remove('hide');update()}
function lose(){active=false;clearInterval(timer);msg.textContent='💥 سقطت القافلة!';reset.classList.remove('hide');document.querySelectorAll('.enemy').forEach(e=>e.remove());}
start.onclick=startGame;reset.onclick=startGame;update();
</script></body></html>
